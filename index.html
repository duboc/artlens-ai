<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>AI Leadership Academy</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1012" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArtLens" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Google Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Google Sans Text', 'Google Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              serif: ['Google Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              // Black + Google Blue Palette
              surface: {
                DEFAULT: '#1a1a1a',
                variant: '#242424',
                dim: 'rgba(26, 26, 26, 0.85)',
              },
              primary: {
                DEFAULT: '#4285F4',
                dark: '#3367D6',
              },
              onPrimary: '#ffffff',
              secondary: {
                DEFAULT: '#9aa0a6',
                dim: '#5f6368',
              },
              accent: {
                DEFAULT: '#4285F4',
              },
              error: '#ea4335',
              success: '#34a853',
              gRed: '#EA4335',
              gYellow: '#FBBC04',
              gGreen: '#34A853',
              gBlue: '#4285F4',
            },
            spacing: {
              'safe-top': 'env(safe-area-inset-top)',
              'safe-bottom': 'env(safe-area-inset-bottom)',
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1)',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'reveal': 'reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards',
              'reveal-delay-1': 'reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards',
              'reveal-delay-2': 'reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards',
              'reveal-delay-3': 'reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards',
              'scan-line': 'scanLine 2s ease-in-out infinite',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'shimmer': 'shimmer 3s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              reveal: {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scanLine: {
                '0%': { transform: 'translateY(-100%)' },
                '50%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(-100%)' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 20px rgba(66, 133, 244, 0.15)' },
                '50%': { boxShadow: '0 0 40px rgba(66, 133, 244, 0.3)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% center' },
                '100%': { backgroundPosition: '200% center' },
              },
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --bg: #0e1012;
        --surface: #1a1a1a;
        --surface-variant: #242424;
        --primary: #4285F4;
        --primary-dim: rgba(66, 133, 244, 0.12);
        --on-primary: #ffffff;
        --secondary: #9aa0a6;
        --text: #e8eaed;
        --error: #ea4335;
        --success: #34a853;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
        font-family: 'Google Sans Text', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Subtle noise texture overlay */
      .noise-bg::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 256px 256px;
      }

      /* Hide scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Google rainbow gradient bar */
      .google-gradient {
        background: linear-gradient(90deg, #EA4335 0%, #EA4335 25%, #FBBC04 25%, #FBBC04 50%, #34A853 50%, #34A853 75%, #4285F4 75%, #4285F4 100%);
      }

      /* Controls floating over the camera: a near-opaque carbon surface keeps them legible on any frame */
      .warm-glass {
        background: rgba(22, 24, 27, 0.92);
        border: 1px solid rgba(66, 133, 244, 0.1);
      }

      /* Capture flash effect */
      .capture-flash {
        animation: captureFlash 0.4s ease-out forwards;
      }

      @keyframes captureFlash {
        0% { opacity: 0.6; }
        100% { opacity: 0; }
      }

      /* dvh fallback for older browsers */
      .h-dvh {
        height: 100vh;
        height: 100dvh;
      }

      /* Safe area padding helpers */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }

      /* Reduced motion: disable blur and animations for low-end devices */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .warm-glass {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: rgba(26, 26, 26, 0.95);
        }
        .noise-bg::before {
          display: none;
        }
      }

      /* Prevent iOS text size adjustment */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* Ensure inputs never trigger iOS zoom (minimum 16px) */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* App-like surface: no tap flash, no page bounce, no accidental text selection */
      html, body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable], .selectable {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      img { -webkit-user-drag: none; }
      /* Result sheet: rounded at medium, edge-to-edge (and under the status bar) at full.
         While dragging only `transform` and this non-inherited number change, so a frame
         costs a composite plus a corner repaint: no style recalc of the content, no layout. */
      @property --sheet-full { syntax: '<number>'; inherits: false; initial-value: 0; }
      .result-sheet {
        border-top-left-radius: calc(28px * (1 - var(--sheet-full)));
        border-top-right-radius: calc(28px * (1 - var(--sheet-full)));
        box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        contain: layout paint;
      }
      /* Layout changes follow the detent (set when the spring starts), not the finger */
      .result-sheet .sheet-header {
        padding-top: 0;
        transition: padding-top 280ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      .result-sheet[data-detent="full"] .sheet-header { padding-top: env(safe-area-inset-top, 0px); }
      /* The page's own photo slides into the sheet at full (it sits above the sheet at medium).
         The hero keeps its layout box; at medium the article is shifted up by its height and the
         scroller clips it, so the reveal is a compositor-only transform + opacity. */
      .result-sheet .sheet-hero {
        height: min(34dvh, 80vw);
        margin-bottom: 16px;
        opacity: 0;
        overflow: hidden;
        transition: opacity 200ms ease-out;
      }
      .result-sheet .scan-article {
        transform: translateY(calc(-1 * (min(34dvh, 80vw) + 16px)));
        transition: transform 320ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      .result-sheet[data-detent="full"] .sheet-hero { opacity: 1; }
      .result-sheet[data-detent="full"] .scan-article { transform: none; }
      /* Content scrolls only at full; at medium a vertical drag moves the sheet */
      .result-sheet [data-sheet-scroller] { overflow-y: hidden; }
      .result-sheet[data-detent="full"] [data-sheet-scroller] { overflow-y: auto; }
      /* Narration text: a 3-line window at medium that follows the spoken sentence; all of it at full */
      .result-sheet[data-detent="medium"] .caption-window {
        max-height: calc(var(--caption-lines, 3) * 1.625em);
        overflow: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .result-sheet .sheet-header, .result-sheet .sheet-hero, .result-sheet .scan-article { transition: none; }
      }
      /* Google Lens style: once a result is open the whole photo fits above the medium sheet */
      .photo-stage {
        will-change: transform;
        height: 50dvh;
        padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
        padding-bottom: 16px;
      }
      /* Full-screen camera frame → photo fitted above the sheet (View Transitions API).
         The sheet itself slides in with its spring; only the photo morphs. */
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
      ::view-transition-group(scan-photo) {
        animation-duration: 420ms;
        animation-timing-function: cubic-bezier(0.32, 0.72, 0, 1);
      }
      ::view-transition-image-pair(scan-photo) { isolation: auto; }
      ::view-transition-old(scan-photo), ::view-transition-new(scan-photo) {
        animation: none;
        mix-blend-mode: normal;
        height: 100%;
        overflow: clip;
        object-fit: cover;
      }
      ::view-transition-old(scan-photo) { display: none; }

      /* Browser surfaces themed from the palette */
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      ::selection {
        background: rgba(66, 133, 244, 0.35);
        color: #ffffff;
      }
      .tabular {
        font-variant-numeric: tabular-nums;
      }
      /* Award toast: the one authored motion of the game layer */
      .award-toast {
        animation: awardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes awardIn {
        from { opacity: 0; transform: translateY(-16px) scale(0.98); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      /* Touch target helper */
      .touch-target {
        min-height: 44px;
        min-width: 44px;
      }

      /* Override for inline/decorative elements */
      .min-h-auto {
        min-height: auto !important;
        min-width: auto !important;
      }
    </style>
</head>
  <body class="noise-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
